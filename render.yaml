services:
  # ============================================================================
  # PRODUCTION ENVIRONMENT (Branch: main)
  # ============================================================================

  # --- Production Backend API Service (FastAPI) ---
  - type: web
    name: algo-trading-api-prod
    branch: main
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: APP_ENV
        value: production

  # --- Production Frontend UI Service (React / Vite) ---
  - type: web
    name: algo-trading-ui-prod
    branch: main
    runtime: docker
    dockerfilePath: ./ui/Dockerfile
    dockerContext: ./ui
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: VITE_APP_ENV
        value: production
      - key: VITE_API_URL
        fromService:
          type: web
          name: algo-trading-api-prod
          property: host

  # ============================================================================
  # DEVELOPMENT / STAGING ENVIRONMENT (Branch: dev)
  # ============================================================================

  # --- Development Backend API Service (FastAPI) ---
  - type: web
    name: algo-trading-api-dev
    branch: dev
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: APP_ENV
        value: development

  # --- Development Frontend UI Service (React / Vite) ---
  - type: web
    name: algo-trading-ui-dev
    branch: dev
    runtime: docker
    dockerfilePath: ./ui/Dockerfile
    dockerContext: ./ui
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: VITE_APP_ENV
        value: development
      - key: VITE_API_URL
        fromService:
          type: web
          name: algo-trading-api-dev
          property: host
